spring:
  application:
    name: SITMUN
  main:
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      fail_on_empty_beans: false
      indent-output: true

  jmx:
    enabled: false

  liquibase:
    change-log: file:./config/db/changelog/db.changelog-master.yaml

  datasource:
    url: jdbc:postgresql://localhost:5432/sitmun3
    username: sitmun3
    password: sitmun3
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Utiliser 'validate' en production si les tables existent déjà
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    rest:
      default-page-size: 100000
      max-page-size: 100000

# =====================================================================================================================
# Logging configuration
# =====================================================================================================================
logging:
  level:
    ROOT: INFO

# =====================================================================================================================
# Management & monitoring
# =====================================================================================================================
management:
  metrics:
    enable:
      all: false
      sitmun: true
  endpoints:
    web:
      base-path: /api/dashboard
      exposure:
        include: health,info
  health:
    ldap:
      enabled: false
    mail:
      enabled: false

# =====================================================================================================================
# SITMUN specific properties
# =====================================================================================================================
sitmun:
  module: SITMUN Core
  version: 3
  language: en
  user:
    secret: 9ef80c644166846897f6a87d3cf6ab204d144229
    token-validity-in-milliseconds: 36000000
  proxy-middleware:
    secret: 9ef80c644166846897f6a87d3cf6ab204d144229
    config-response-validity-in-seconds: 3600
    force: false
    url: http://localhost:8080/middleware
  ui:
    image:
      supportedFormats:
        - png
        - jpg
        - jpeg
      defaultWidth: 125
      defaultHeight: 125
      sizes:
        - type: menu
          width: 50
          height: 50
        - type: list
          width: 350
          height: 350
  dashboard:
    fetchMetrics: 60000
    initialDelay: 60000
    cartographies-by-created-date:
      size: 30
      query: |
        select year(c.createdDate) as y, month(c.createdDate) as m, day(c.createdDate) as d, count(c) 
        from Cartography as c
        group by year(c.createdDate), month(c.createdDate), day(c.createdDate)
        order by y, m, d desc
    users-by-created-date:
      size: 30
      query: |
        select year(u.createdDate) as y, month(u.createdDate) as m, count(u)
        from User u
        group by year(u.createdDate), month(u.createdDate)
        order by y, m desc
    users-per-application:
      size: 30
      query: |
        select app.name, count(distinct uc.user)
        from UserConfiguration uc, Role r, Application app
        where uc.role = r and r member of app.availableRoles
        group by app.name
  startup:
    code-lists:
      check-on-startup: true
      database-connection-drivers:
        - driver-class: org.postgresql.Driver
          description: PostgreSQL JDBC Driver
      code-list-values:
        # (toutes tes valeurs de code-list ici, inchangées)
        - code-list-name: application.type
          value: T
          description: Tourist application
        - code-list-name: application.type
          value: ED
          description: Edition application
        # etc...
  recover-password:
    front:
      url: "http://localhost:4200"
      path: "/auth/forgot-password/"
    mail:
      from: "sitmun-test@localhost"
    jwt:
      token-recovery-password-validity-in-milliseconds: 3600000
    code-otp:
      max-attempt: 3